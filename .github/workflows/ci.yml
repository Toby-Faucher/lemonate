name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a second push to main must not cancel the first commit's run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      # Release mode: the search tests and perft are far too slow in debug.
      # No target-cpu flags here: the runner's CPU is not the one the engine is tuned for.
      - name: Test (unit, perft, end-to-end UCI)
        run: cargo test --release
      - name: Build both binaries
        run: cargo build --release --bins

  rust-debug:
    name: unit tests with overflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The release profile turns off overflow checks and debug_assert!, so this is the only run
      # in which an arithmetic overflow or a broken assertion can fail a test.
      - name: Test (unit tests, debug profile)
        run: cargo test --lib

  bench-tooling:
    name: bench tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the record logic
        run: python3 bench/test_bench.py
      - name: Research scripts
        run: |
          cd research/scripts/tests
          for t in test_catalog test_cfg test_result test_sprt_parse; do python3 -m unittest $t; done
      - name: Scripts parse
        run: python3 -m py_compile bench/*.py research/scripts/*.py
