name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a second push to main must not cancel the first commit's run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      # Release mode: the search tests and perft are far too slow in debug.
      # No target-cpu flags here: the runner's CPU is not the one the engine is tuned for.
      - name: Test (unit, perft, end-to-end UCI)
        run: cargo test --release
      - name: Build both binaries
        run: cargo build --release --bins

  rust-debug:
    name: unit tests with overflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The release profile turns off overflow checks and debug_assert!, so this is the only run
      # in which an arithmetic overflow or a broken assertion can fail a test.
      - name: Test (unit tests, debug profile)
        run: cargo test --lib

  clippy:
    name: clippy (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not a gate yet: the existing warnings are being cleared after the open experiment branches land.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets

  bench-tooling:
    name: bench tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the record logic
        run: |
          python3 bench/test_bench.py
          python3 bench/test_sprt.py
      - name: Research scripts
        run: |
          cd research/scripts/tests
          for t in test_catalog test_cfg test_result test_sprt_parse; do python3 -m unittest $t; done
      - name: Scripts parse
        run: python3 -m py_compile bench/*.py research/scripts/*.py

  caltrop:
    name: caltrop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Rule changes change the counts, so caltrop and ast-grep are pinned. Bump with caltrop.toml in the same PR.
      CALTROP_REF: 4a6ed53727c3dc82a90a738afbe7287def83ca9b
    steps:
      - uses: actions/checkout@v4
      # Cloned outside the checkout so caltrop is not scanned.
      - run: |
          git clone https://github.com/Toby-Faucher/caltrop "$RUNNER_TEMP/caltrop"
          git -C "$RUNNER_TEMP/caltrop" checkout "$CALTROP_REF"
          pipx install ast-grep-cli==0.44.1
          echo "$RUNNER_TEMP/caltrop" >> "$GITHUB_PATH"
      - run: caltrop check
