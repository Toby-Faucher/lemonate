<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alpha-Beta Pruning — Lemonate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem;
      font-family: 'Courier New', Courier, monospace;
    }
    h1 {
      color: #0f172a;
      font-size: 2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: #475569;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      letter-spacing: 0.04em;
    }
    sup { font-size: 0.7em; }
    .btn {
      margin-top: 2rem;
      padding: 0.6rem 1.6rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Alpha-Beta Pruning</h1>
  <p class="subtitle">
    Reduces search from O(b<sup>d</sup>) &rarr; O(b<sup>d/2</sup>) &nbsp;&mdash;&nbsp; Lemonate Chess Engine
  </p>

  <svg id="diagram" width="920" height="520" viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg">

    <!-- depth dividers -->
    <line x1="58" y1="120" x2="900" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,9"/>
    <line x1="58" y1="245" x2="900" y2="245" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,9"/>
    <line x1="58" y1="370" x2="900" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,9"/>

    <!-- depth labels -->
    <text x="36" y="76"  fill="#cbd5e1" font-size="11" font-family="Courier New" text-anchor="middle">d=0</text>
    <text x="36" y="198" fill="#cbd5e1" font-size="11" font-family="Courier New" text-anchor="middle">d=1</text>
    <text x="36" y="316" fill="#cbd5e1" font-size="11" font-family="Courier New" text-anchor="middle">d=2</text>
    <text x="36" y="424" fill="#cbd5e1" font-size="11" font-family="Courier New" text-anchor="middle">d=3</text>

    <!-- ══════════════════════════════════════════
         EDGES
         ══════════════════════════════════════════ -->

    <!-- Root → A  (green: best path) -->
    <line x1="445" y1="100" x2="223" y2="170" stroke="#16a34a" stroke-width="2.5"/>

    <!-- Root → B  (gray) -->
    <line x1="475" y1="100" x2="700" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- A → A1  (green: best path) -->
    <line x1="200" y1="220" x2="120" y2="290" stroke="#16a34a" stroke-width="2.5"/>

    <!-- A → A2  (gray) -->
    <line x1="230" y1="220" x2="338" y2="290" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- B → B1  (gray) -->
    <line x1="688" y1="220" x2="608" y2="290" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- B → B2  (PRUNED: red dashed) -->
    <line x1="720" y1="218" x2="800" y2="291" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,4"/>

    <!-- A1 → leaf 3  (gray) -->
    <line x1="98"  y1="339" x2="72"  y2="400" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- A1 → leaf 5  (green: best path) -->
    <line x1="122" y1="339" x2="158" y2="400" stroke="#16a34a" stroke-width="2.5"/>

    <!-- A2 → leaf 4  (gray) -->
    <line x1="328" y1="339" x2="302" y2="400" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- A2 → leaf 6  (amber: triggers cutoff) -->
    <line x1="350" y1="339" x2="390" y2="400" stroke="#d97706" stroke-width="2"/>

    <!-- A2 → leaf PRUNED  (red dashed) -->
    <line x1="360" y1="337" x2="458" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- B1 → leaf 2  (gray) -->
    <line x1="590" y1="339" x2="567" y2="400" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- B1 → leaf 1  (gray) -->
    <line x1="614" y1="339" x2="638" y2="400" stroke="#94a3b8" stroke-width="1.5"/>


    <!-- ══════════════════════════════════════════
         INTERNAL NODES
         ══════════════════════════════════════════ -->

    <!-- ROOT (MAX) -->
    <circle cx="460" cy="76" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="460" y="70"  text-anchor="middle" fill="#3b82f6" font-size="9"  font-family="Courier New" letter-spacing="1">MAX ▲</text>
    <text x="460" y="86"  text-anchor="middle" fill="#1d4ed8" font-size="18" font-family="Courier New" font-weight="bold">5</text>
    <text x="460" y="28"  text-anchor="middle" fill="#2563eb" font-size="11" font-family="Courier New">White to move</text>
    <text x="500" y="64"  fill="#94a3b8" font-size="10" font-family="Courier New">α: −∞ → 5</text>
    <text x="500" y="76"  fill="#94a3b8" font-size="10" font-family="Courier New">β: +∞</text>

    <!-- A (MIN) -->
    <circle cx="210" cy="196" r="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="210" y="190" text-anchor="middle" fill="#8b5cf6" font-size="9"  font-family="Courier New" letter-spacing="1">MIN ▽</text>
    <text x="210" y="206" text-anchor="middle" fill="#6d28d9" font-size="18" font-family="Courier New" font-weight="bold">5</text>
    <text x="248" y="185" fill="#94a3b8" font-size="10" font-family="Courier New">β: → 5</text>

    <!-- B (MIN) -->
    <circle cx="710" cy="196" r="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="710" y="190" text-anchor="middle" fill="#8b5cf6" font-size="9"  font-family="Courier New" letter-spacing="1">MIN ▽</text>
    <text x="710" y="206" text-anchor="middle" fill="#6d28d9" font-size="18" font-family="Courier New" font-weight="bold">≤2</text>
    <text x="748" y="185" fill="#94a3b8" font-size="10" font-family="Courier New">α: 5</text>

    <!-- A1 (MAX) — best path -->
    <circle cx="108" cy="315" r="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="108" y="309" text-anchor="middle" fill="#16a34a" font-size="9"  font-family="Courier New" letter-spacing="1">MAX ▲</text>
    <text x="108" y="325" text-anchor="middle" fill="#15803d" font-size="18" font-family="Courier New" font-weight="bold">5</text>

    <!-- A2 (MAX) -->
    <circle cx="342" cy="315" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="342" y="309" text-anchor="middle" fill="#3b82f6" font-size="9"  font-family="Courier New" letter-spacing="1">MAX ▲</text>
    <text x="342" y="325" text-anchor="middle" fill="#1d4ed8" font-size="18" font-family="Courier New" font-weight="bold">6</text>
    <text x="376" y="306" fill="#94a3b8" font-size="10" font-family="Courier New">β: 5</text>

    <!-- B1 (MAX) -->
    <circle cx="602" cy="315" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="602" y="309" text-anchor="middle" fill="#3b82f6" font-size="9"  font-family="Courier New" letter-spacing="1">MAX ▲</text>
    <text x="602" y="325" text-anchor="middle" fill="#1d4ed8" font-size="18" font-family="Courier New" font-weight="bold">2</text>

    <!-- B2 (PRUNED entirely) -->
    <circle cx="808" cy="315" r="26" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="808" y="321" text-anchor="middle" fill="#dc2626" font-size="22" font-weight="bold">✕</text>
    <text x="808" y="355" text-anchor="middle" fill="#dc2626" font-size="10" font-family="Courier New">α-cutoff</text>
    <text x="808" y="367" text-anchor="middle" fill="#64748b" font-size="10" font-family="Courier New">B≤2 &lt; α=5</text>


    <!-- ══════════════════════════════════════════
         LEAF NODES
         ══════════════════════════════════════════ -->

    <!-- leaf 3  (under A1) -->
    <rect x="49"  y="400" width="46" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="72"  y="421" text-anchor="middle" fill="#1e293b" font-size="16" font-family="Courier New" font-weight="bold">3</text>

    <!-- leaf 5  (under A1) — BEST -->
    <rect x="135" y="398" width="46" height="30" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="158" y="419" text-anchor="middle" fill="#15803d" font-size="16" font-family="Courier New" font-weight="bold">5</text>
    <text x="188" y="416" fill="#16a34a" font-size="13">✓</text>

    <!-- leaf 4  (under A2) -->
    <rect x="279" y="400" width="46" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="302" y="421" text-anchor="middle" fill="#1e293b" font-size="16" font-family="Courier New" font-weight="bold">4</text>

    <!-- leaf 6  (under A2) — triggers β-cutoff -->
    <rect x="368" y="400" width="46" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="391" y="421" text-anchor="middle" fill="#b45309" font-size="16" font-family="Courier New" font-weight="bold">6</text>
    <text x="391" y="443" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Courier New">6 ≥ β=5</text>
    <text x="391" y="455" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Courier New">β-cutoff</text>

    <!-- leaf PRUNED  (under A2) -->
    <rect x="436" y="400" width="46" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="459" y="421" text-anchor="middle" fill="#dc2626" font-size="16">✕</text>

    <!-- leaf 2  (under B1) -->
    <rect x="545" y="400" width="46" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="568" y="421" text-anchor="middle" fill="#1e293b" font-size="16" font-family="Courier New" font-weight="bold">2</text>

    <!-- leaf 1  (under B1) -->
    <rect x="615" y="400" width="46" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="638" y="421" text-anchor="middle" fill="#1e293b" font-size="16" font-family="Courier New" font-weight="bold">1</text>


    <!-- ══════════════════════════════════════════
         LEGEND
         ══════════════════════════════════════════ -->
    <rect x="58" y="478" width="804" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <circle cx="92"  cy="496" r="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text   x="108" y="500" fill="#64748b" font-size="11" font-family="Courier New">MAX (maximising)</text>

    <circle cx="270" cy="496" r="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text   x="286" y="500" fill="#64748b" font-size="11" font-family="Courier New">MIN (minimising)</text>

    <line   x1="440" y1="496" x2="470" y2="496" stroke="#16a34a" stroke-width="2.5"/>
    <text   x="479" y="500" fill="#64748b" font-size="11" font-family="Courier New">Best path (score = 5)</text>

    <line   x1="650" y1="496" x2="680" y2="496" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <text   x="689" y="500" fill="#64748b" font-size="11" font-family="Courier New">Pruned (not searched)</text>

  </svg>

  <button class="btn" onclick="downloadPNG()">Download PNG</button>

  <script>
    function downloadPNG() {
      const svg = document.getElementById('diagram');
      const svgData = new XMLSerializer().serializeToString(svg);
      const scale = 3;
      const canvas = document.createElement('canvas');
      canvas.width  = 920 * scale;
      canvas.height = 520 * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const img  = new Image();

      img.onload = function () {
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = 'alpha-beta-pruning.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }
  </script>
</body>
</html>
